const curtainEl = $('.curtain');
let curtainState = curtainEl && getComputedStyle(curtainEl).display !== 'none' ? 'closed' : 'gone';
function openCurtain(){
  if (curtainState !== 'closed') return;
  curtainState = 'opening';
  const late = performance.now() >= 4000; // the stylesheet's own fallback is already parting it
  curtainEl.classList.add(late ? 'parting' : 'open');
  setTimeout(() => { curtainState = 'gone'; curtainEl.remove(); }, late ? Math.max(0, 5400 - performance.now()) : 1300);
}
// It parts once the fonts are in (so the marquee is right), never later than 2.5 s.
Promise.race([document.fonts?.ready, new Promise(r => setTimeout(r, 2500))])
  .then(() => setTimeout(openCurtain, Math.max(0, 1400 - performance.now())));
// Close it, change the scene behind it, open it again.
function curtainSwap(mid){
  if (reduced() || curtainState !== 'gone'){ mid?.(); return; }
  const c = document.createElement('div');
  c.className = 'curtain shut'; c.setAttribute('aria-hidden', 'true');
  c.innerHTML = '<div class="curtain-l"></div><div class="curtain-r"></div>';
  document.body.appendChild(c);
  setTimeout(() => { mid?.(); setTimeout(() => { c.classList.add('open'); setTimeout(() => c.remove(), 1500); }, 500); }, 850);
}

let screenOn = false;
function splitTitle(t){
  if (t.length <= 15) return [t];
  let best = -1; const mid = t.length / 2;
  for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
  return best < 0 ? [t] : [t.slice(0, best).replace(/:$/, ''), t.slice(best + 1)];
}
function openScreen(id){
  const m = movie(id);
  if (!m) return;
  if (!m.yt){ window.open(trailerUrl(m), '_blank', 'noopener'); return; }
  if (screenOn) return;
  screenOn = true;
  const prev = document.activeElement, prevOverflow = document.body.style.overflow;
  const o = document.createElement('div');
  o.className = 'screen-overlay';
  o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-label', `Trailer: ${m.t}`);
  o.innerHTML = `<div class="screen-room">
      <div class="marquee screen-marquee"><div class="board" role="img" aria-label="Now showing: ${esc(m.t)}">${tiles('Now showing', 'sm red')}${splitTitle(m.t).map(t => tiles(t)).join('')}</div><div class="bulbs-low" aria-hidden="true"></div></div>
      <div class="screen-frame"><div class="screen-picture"></div><div class="screen-curtain" aria-hidden="true"><span></span><span></span></div></div>
      <div class="screen-actions"><button class="btn btn-primary notch-x" type="button" data-r="close">Close</button><a href="https://www.youtube.com/watch?v=${encodeURIComponent(m.yt)}" target="_blank" rel="noopener">Won\u2019t play? Open it on YouTube</a></div>
    </div><div class="screen-seats" aria-hidden="true"></div>`;
  document.body.appendChild(o);
  document.body.style.overflow = 'hidden';
  updateDock();
  const close = o.querySelector('[data-r="close"]');
  close.focus({preventScroll:true});
  // The projector starts as the screen's curtain parts (the tap still counts as the go-ahead for sound).
  const roll = setTimeout(() => {
    o.querySelector('.screen-picture').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.yt)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="Trailer: ${esc(m.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    o.classList.add('rolling');
  }, reduced() ? 0 : 700);
  // Android's back button closes the room instead of leaving the site.
  let pushed = false;
  try { history.pushState({wpxScreen:1}, ''); pushed = true; } catch {}
  let ending = false;
  const end = fromPop => {
    if (ending) return;
    if (!fromPop && pushed && history.state?.wpxScreen){ history.back(); return; } // popstate comes back here
    ending = true;
    clearTimeout(roll);
    window.removeEventListener('popstate', onPop);
    document.removeEventListener('keydown', onKey, true);
    const done = () => {
      o.remove(); screenOn = false;
      document.body.style.overflow = prevOverflow;
      updateDock();
      if (prev && document.contains(prev)) prev.focus({preventScroll:true});
    };
    if (reduced()) return done();
    o.classList.add('closing'); // the curtain draws shut, then the lights come up
    setTimeout(() => { const p = o.querySelector('.screen-picture'); if (p) p.innerHTML = ''; }, 560); // sound stops behind the curtain
    setTimeout(done, 1000);
  };
  const onPop = () => end(true);
  function onKey(e){
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); end(); }
    if (e.key === 'Tab'){ // focus stays in the room: Close, the picture, the YouTube link
      const stops = [...o.querySelectorAll('button, iframe, a')];
      const at = stops.indexOf(document.activeElement);
      e.preventDefault();
      stops[(at + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
    }
  }
  window.addEventListener('popstate', onPop);
  document.addEventListener('keydown', onKey, true);
  close.addEventListener('click', () => end());
}

/* =====================================================================
   ACTIONS (event delegation via data-act)
   ===================================================================== */
const toggleIn = (map, id) => { const a = map[id] ||= []; const i = a.indexOf(S.me); if (i < 0) a.push(S.me); else a.splice(i, 1); return i < 0; };
function addMovie(id, quiet){
  if (S.shelf.includes(id)) return;
  if (!S.movies[id]) S.movies[id] = CATALOG[id];
  S.shelf.push(id); ADDED[id] = [S.me, todayIso()];
  (S.thumbs[id] ||= []).includes(S.me) || S.thumbs[id].push(S.me);
  if (!quiet) toast(`${movie(id).t} is on the shelf, with your thumbs-up.`);
}
function refreshSheet(){
  const k = S.ui.sheet; if (!k || k.type !== 'detail') return;
  const top = $('.sheet')?.scrollTop || 0;
  openDetail(k.id);
  $('.sheet').style.animation = 'none'; $('.scrim').style.animation = 'none'; $('.sheet').scrollTop = top;
}
const ACT = {
  goto(d){ if (S.ui.sheet) closeLayer(); scrollToId(d.anchor && $('#' + d.anchor) ? d.anchor : d.target); },
  join(){
    const n = next(); if (!n) return;
    const a = S.avail[n.date] ||= []; if (!a.includes(S.me)) a.push(S.me);
    renderAll(); toast(`You’re in for ${dayWord(n.date) === 'Tonight' ? 'tonight' : dayWord(n.date)}. Go cast a vote.`);
  },
  leave(){
    const n = next(); if (!n) return;
    S.avail[n.date] = (S.avail[n.date] || []).filter(p => p !== S.me);
    delete n.votes[S.me]; delete n.writeIns[S.me]; delete n.vetoes[S.me];
    renderAll(); toast('Got it, you’re out. Your vote and write-in came off the ballot.');
  },
  vote(d){
    const n = next();
    if (!n || phase(n) !== 'open') return toast('Voting’s closed for this one.');
    if (!coming(n).includes(S.me)) return toast(`Mark yourself in for ${dayWord(n.date)} first.`);
    const had = n.votes[S.me] === d.id, prev = n.votes[S.me];
    if (had) delete n.votes[S.me]; else n.votes[S.me] = d.id;
    if (S.ui.sheet) closeLayer();
    renderAll();
    if (had) toast('Vote taken back. Spend it anywhere.');
    else { punch(d.id); toast(prev ? `Moved your vote to ${movie(d.id).t}.` : `Punched. Your vote: ${movie(d.id).t}.`); }
  },
  veto(d){
    const n = next(); if (!n || phase(n) !== 'open' || !coming(n).includes(S.me)) return;
    const t = movie(d.id).t;
    if (n.vetoes[S.me] === d.id){ delete n.vetoes[S.me]; toast(`Veto taken back. ${t} is back in play.`); }
    else {
      const prev = n.vetoes[S.me]; n.vetoes[S.me] = d.id;
      if (n.votes[S.me] === d.id) delete n.votes[S.me];
      toast(prev ? `Veto moved from ${movie(prev).t} to ${t}.` : `${t} is out for ${dayWord(n.date) === 'Tonight' ? 'tonight' : dayWord(n.date)}.`);
    }
    closeLayer(); renderAll();
  },
  writein(){
    const n = next(); if (!n) return;
    if (!coming(n).includes(S.me)) return toast(`Mark yourself in for ${dayWord(n.date)} to get a write-in.`);
    openWriteIn();
  },
  pickwrite(d){
    const n = next(); if (!n) return;
    if (Object.entries(n.writeIns).some(([p, id]) => id === d.id && p !== S.me)) return toast('Someone already wrote that one in.');
    if (!S.shelf.includes(d.id)) addMovie(d.id, true);
    const swap = n.writeIns[S.me]; n.writeIns[S.me] = d.id;
    closeLayer(); renderAll(); scrollToId('ballot');
    toast(swap ? `Write-in swapped to ${movie(d.id).t}.` : `Written in: ${movie(d.id).t}. It’s on the ballot now.`);
  },
  detail(d){ openDetail(d.id); },
  thumb(d){ const on = toggleIn(S.thumbs, d.id); renderAll(); refreshSheet(); if (on) popBtn(`[data-act="thumb"][data-id="${d.id}"]`); },
  seen(d){ const on = toggleIn(S.seen, d.id); renderAll(); refreshSheet(); if (on) popBtn(`[data-act="seen"][data-id="${d.id}"]`); },
  add(d){
    addMovie(d.id);
    if (S.ui.sheet?.type === 'surprise') closeLayer();
    renderAll(); refreshSheet();
  },
  source(d){
    if (d.src === 'surprise') return openSurprise();
    S.ui.source = S.ui.source === d.src ? null : d.src; S.ui.query = '';
    renderShelf();
  },
  paste(){ openPaste(); },
  sort(d){ S.ui.sort = d.sort; renderShelf(); },
  day(d){
    const a = S.avail[d.day] ||= [], i = a.indexOf(S.me);
    if (i < 0) a.push(S.me);
    else { a.splice(i, 1); const n = nightOn(d.day); if (n){ delete n.votes[S.me]; delete n.writeIns[S.me]; delete n.vetoes[S.me]; } }
    if (S.ui.hosting && S.ui.hosting !== d.day) S.ui.hosting = false;
    S.ui.day = d.day;
    renderAll();
  },
  hostday(d){
    S.ui.day = d.day; S.ui.hosting = d.day; renderAll();
    requestAnimationFrame(() => $('#day-detail')?.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'center'}));
  },
  hostcancel(){ S.ui.hosting = false; renderCalendar(); },
  hosttime(d){
    const owner = S.me === OWNER;
    S.nights.push({id:'n' + d.day.replace(/-/g, ''), date:d.day, time:d.time, host:S.me, place:P(S.me).place, theme:null, house:owner,
      writeIns:{}, votes:{}, vetoes:{}, housePick:null, snacks:[]});
    const a = S.avail[d.day] ||= []; if (!a.includes(S.me)) a.push(S.me);
    S.ui.hosting = false; renderAll();
    toast(`You’re hosting ${shortDate(d.day)} at ${fmtT(d.time)}. The ballot is open.`);
  },
  unhost(d){
    S.nights = S.nights.filter(n => !(n.date === d.day && n.host === S.me));
    renderAll(); toast('Night cancelled. Everyone free that night keeps their mark.');
  },
  subscribe(){ openSubscribe(); },
  copy(d){ (navigator.clipboard?.writeText(d.copy) || Promise.reject()).then(() => toast('Link copied.'), () => toast('Copy didn’t work here. Press and hold the link instead.')); },
  reveal(){ doReveal(); },
  rate(d){ const h = S.history[0]; h.ratings[S.me] = +d.n; renderAll(); toast(RATE_WORDS[+d.n] + '. Noted.'); },
  unsnack(d){ const n = next(); n.snacks.splice(+d.i, 1); renderAfter(); },
  housepick(d){ const n = next(); n.housePick = d.id || null; renderAll(); toast(d.id ? `House pick: ${movie(d.id).t}.` : 'House pick removed.'); },
  hswitch(d){ S.house[d.k] = !S.house[d.k]; renderAll(); },
  since(){ openSince(0); },
  'since-next'(){ openSince(S.ui.step + 1, true); },
  'since-prev'(){ openSince(S.ui.step - 1, true); },
  'since-done'(){ sinceDone(); },
  'since-go'(){ sinceDone(); scrollToId('ballot'); },
  who(){ openBoxOffice(); },
  pickname(d){ signIn(d.id); },
  theme(){
    const t = effTheme() === 'dark' ? 'light' : 'dark';
    LS.set('theme', t); applyTheme(t);
    toast(t === 'dark' ? 'Midnight. House lights down.' : 'Matinee. House lights up.');
    if (S.ui.sheet?.type === 'spec') openSpec();
  },
  'theme-edit'(){
    const n = next(); if (!n) return;
    const ideas = ['Don’t go down there', 'Found-footage night', 'Older than us', 'Under 90 minutes', 'Creature feature'];
    sheet(`<p class="label faint" style="margin:0 0 6px">You’re hosting · ${shortDate(n.date)}</p><h2>Set a theme</h2>
      <p class="muted" style="margin:8px 0 16px">A nudge for write-ins. It doesn’t filter the ballot.</p>
      <form data-form="theme"><div class="field"><label for="th">Theme</label><input id="th" maxlength="40" value="${esc(n.theme || '')}" placeholder="Creature feature"></div>
      <div class="chips" style="margin-bottom:16px">${ideas.map(i => `<button type="button" class="chip" data-act="theme-idea" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>
      <div class="detail-acts"><button class="btn btn-ghost" type="button" data-act="theme-clear">No theme</button><button class="btn btn-primary" type="submit">Save</button></div></form>`, 'Set a theme', {type:'theme'});
  },
  'theme-idea'(d){ $('#th').value = d.v; },
  'theme-clear'(){ next().theme = null; closeLayer(); renderAll(); },
  preview(){ openPreview(); },
  reset(){ LS.del('revealed:' + S.scn); LS.del('since:' + S.scn); load(S.scn); toast('Reveal and walkthrough reset.'); },
  spec(){ openSpec(); },
  trailer(d){ openScreen(d.id); },
  curtain(){ closeLayer(); curtainSwap(); },
  close(){ if (!S.me) return openBoxOffice(); closeLayer(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, n = next();
  if (k === 'search'){ const r = search(S.ui.query); if (r.length === 1 && !S.shelf.includes(r[0])) ACT.add({id:r[0]}); else $('#q')?.blur(); }
  if (k === 'paste') doPaste($('#pl').value);
  if (k === 'name') signInByName($('#nm').value);
  if (k === 'snack' && n){ const v = $('#sn').value.trim(); if (!v) return; n.snacks.push({who:S.me, what:v}); renderAfter(); toast(`Claimed: ${v}.`); }
  if (k === 'review'){ const v = $('#rv').value.trim(), h = S.history[0]; if (!v || !h) return; h.reviews = [{who:S.me, text:v}, ...h.reviews.filter(r => r.who !== S.me)]; renderAfter(); toast('Posted for the group.'); }
  if (k === 'season'){ const v = $('#se').value.trim(); if (!v) return; S.season = v; LS.set('season', v); renderAll(); toast('Season title updated on the marquee.'); }
  if (k === 'theme' && n){ n.theme = $('#th').value.trim() || null; closeLayer(); renderAll(); toast(n.theme ? `Theme set: “${n.theme}”.` : 'Theme cleared.'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.ui.query = e.target.value; if (S.ui.query) S.ui.source = null; $('#finder').innerHTML = finder(); }
  if (e.target.id === 'wq') $('#wlist').innerHTML = writeList(e.target.value);
});
document.addEventListener('change', e => {
  if (e.target.name === 'scn'){ const v = e.target.value; closeLayer(); curtainSwap(() => load(v)); }
  if (e.target.name === 'as'){ S.me = e.target.value; LS.set('me', S.me); closeLayer(); renderAll(); toast(`Viewing as ${P(S.me).name}.`); }
});
document.addEventListener('keydown', e => {
  const k = S.ui.sheet?.type;
  if (k === 'since' && e.key === 'ArrowRight') ACT['since-next']();
  if (k === 'since' && e.key === 'ArrowLeft') ACT['since-prev']();
  if (e.key === 'Escape' && k && !screenOn){ if (k === 'since') sinceDone(); else ACT.close(); }
});

/* =====================================================================
   THEME, SPY, DOCK, CLOCK, BOOT
   ===================================================================== */
const effTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  $('meta[name="theme-color"]').content = effTheme() === 'dark' ? '#120b08' : '#efe2c6';
}
function updateDots(){
  const n = next();
  const need = {
    tonight: !!(n && ((phase(n) === 'open' && coming(n).includes(S.me) && !n.votes[S.me]) || (phase(n) === 'locked' && !S.revealed[n.id]))),
    calendar: !n, shelf: !S.shelf.length, after: needsRating(),
  };
  $$('#reel a').forEach(a => { a.querySelector('.dot')?.remove(); if (need[a.dataset.spy]) a.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); });
}
function renderAll(){
  $('#season').textContent = S.season;
  $('#me-chip').innerHTML = S.me ? `${av(S.me, 'sm')}<span>${esc(P(S.me).name)}</span>` : '<span style="padding-left:8px">Sign in</span>';
  renderRibbon(); renderMarquee(); renderAdmit(); renderMove();
  renderTonight(); renderCalendar(); renderShelf(); renderAfter(); renderFoot();
  updateDots(); updateDock();
}
function load(scn){
  if (!SCENARIOS[scn]) scn = 'open';
  S = build(scn); t0 = Date.now(); lastBoard = '';
  closeLayer(); renderAll(); window.scrollTo({top:0});
  if (!S.me) openBoxOffice();
}

const spy = new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) $$('#reel a').forEach(a => a.setAttribute('aria-current', a.dataset.spy === en.target.id ? 'true' : 'false'));
}), {rootMargin:'-40% 0px -55% 0px'});
const vis = {};
function updateDock(){ const t = $('#dock').dataset.target; $('#dock').classList.toggle('away', !!(vis.move || vis[t] || S.ui?.sheet || screenOn)); }
const dockObs = new IntersectionObserver(es => { es.forEach(en => { vis[en.target.id] = en.intersectionRatio >= .12; }); updateDock(); }, {threshold:[0, .12, .3]});
let phaseKey = '';
setInterval(() => {
  $$('.js-count').forEach(el => { el.textContent = countdown(new Date(+el.dataset.to)); });
  const n = S && next(), key = n ? n.id + phase(n) : 'none';
  if (phaseKey && key !== phaseKey && !S.ui.sheet) renderAll();
  phaseKey = key;
}, 1000);

applyTheme(LS.get('theme', null));
load(new URLSearchParams(location.search).get('state') || 'open');
$$('#reel a')[0].setAttribute('aria-current', 'true');
['tonight', 'calendar', 'shelf', 'after'].forEach(id => { spy.observe($('#' + id)); dockObs.observe($('#' + id)); });
dockObs.observe($('#move'));
</script>
</body>
